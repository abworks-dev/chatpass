[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "chatpass"
version = "0.1.0"
description = "Local-first gateway for authorized ChatGPT subscription access"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = [
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
  "src/chatpass/static/vendor/LICENSE.tabler",
]
authors = [{ name = "ChatPass contributors" }]
keywords = ["chatgpt", "oauth", "responses-api", "local-first", "api-gateway"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "cryptography>=44,<50",
  "PyJWT[crypto]>=2.10,<3",
  "keyring>=25,<27",
  "portalocker>=3,<4",
]

[project.urls]
Homepage = "https://github.com/abworks-dev/chatpass"
Repository = "https://github.com/abworks-dev/chatpass"
Issues = "https://github.com/abworks-dev/chatpass/issues"
Documentation = "https://github.com/abworks-dev/chatpass#readme"

[project.scripts]
chatpass = "chatpass.cli:main"

[dependency-groups]
dev = [
    "playwright>=1.50,<2",
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chatpass"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
